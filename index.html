const gm=n=>{const D=2*Math.PI/n,s=Math.sin(D/2),c=Math.cos(D/2),H=(c+.7071)/s-.5,a=n==4?2.4:2,Y=n==4?6:(1.6+a*c)/s+a,Rv=n==4?0:Y+a+a/Math.tan(Math.PI/2-Math.PI/n)+.3;return{n,D,s,c,H,L:13*n,Y,a,Rv,E:(n==4?Math.max(Y+a,H+6.5):Rv)+.5}};
const rho=(g,k)=>g.n==4?0:fa(g,k)+g.D/2;
const fa=(g,k)=>Math.PI+g.D*k;
const xy=(g,k,u,v)=>{const f=fa(g,k);return[u*Math.cos(f)-v*Math.sin(f),u*Math.sin(f)+v*Math.cos(f)]};
function ring(g,i){const k=Math.floor(i/13),j=i%13;return j<6?xy(g,k,g.H+j+.5,-1):j==6?xy(g,k,g.H+5.5,0):xy(g,k,g.H+12.5-j,1)}

  if(p<g.L)return ring(g,(13*k+7+p)%g.L);
  if(p<g.L+5)return xy(g,k,g.H+4.5-(p-g.L),0);
  return xy(g,k,g.H*.62,(i-1.5)*.3);
}
const mov=(a,n)=>a===0?n===6:a+n<=G.L+5;

const star=(x,y,c,id)=>{let p='';for(let i=0;i<10;i++){const r=i%2?.16:.38,a=-Math.PI/2+i*Math.PI/5;p+=(x+r*Math.cos(a)).toFixed(2)+','+(y+r*Math.sin(a)).toFixed(2)+' '}return `<polygon${id!==undefined?` id="s${id}" class="star"`:''} points="${p}" fill="${c}"/>`};
const arrow=(x,y,rad,c)=>`<path d="M-.3 -.12H.05V-.3L.38 0L.05 .3V.12H-.3Z" fill="${c}" transform="translate(${x} ${y}) rotate(${rad*180/Math.PI})"/>`;
const cr=(g,x,y,k,fill)=>`<rect x="${x-.48}" y="${y-.48}" width=".96" height=".96" rx=".12" fill="${fill}" stroke="#777" stroke-width=".06" transform="rotate(${(fa(g,k)*180/Math.PI).toFixed(2)} ${x.toFixed(3)} ${y.toFixed(3)})"/>`;

  else{const pts=[];for(let k=0;k<g.n;k++){const f=fa(g,k)+g.D/2;pts.push((g.Rv*Math.cos(f)).toFixed(2)+','+(g.Rv*Math.sin(f)).toFixed(2))}s+=`<polygon points="${pts.join(' ')}" fill="url(#bg)" stroke="#1b1250" stroke-width=".5" stroke-linejoin="round"/>`}
  for(let k=0;k<g.n;k++){
    const f=fa(g,k)+g.D/2,cx=g.Y*Math.cos(f),cy=g.Y*Math.sin(f),a=g.a,deg=rho(g,k)*180/Math.PI;
    s+=`<g transform="translate(${cx} ${cy}) rotate(${deg})"><rect id="yo${k}" class="yo" x="${-a-.22}" y="${-a-.22}" width="${2*a+.44}" height="${2*a+.44}" rx=".75"/><rect id="yh${k}" x="${-a}" y="${-a}" width="${2*a}" height="${2*a}" rx=".55" fill="url(#y${k})"/><rect x="${-a+.45}" y="${-a+.45}" width="${2*a-.9}" height="${2*a-.9}" rx=".4" fill="#fff"/>`;

  return s+'</g><g id="fx"></g></svg>';
}
function layout(){if(!S||!disp)return;
  const cnt={};
  S.players.forEach((p,j)=>disp[j].forEach((d,i)=>{
    const el=$('t'+j+'_'+i);if(!el)return;
    const[x,y]=pos(G,p.arm,d,i),key=d>0?x.toFixed(1)+','+y.toFixed(1):'y'+j+i,k=cnt[key]=(cnt[key]||0)+1,o=(k-1)*.22;
    el.style.transform=`translate(${x+o}px,${y-o}px)`;
    const can=myTurn()&&S.dice&&j===S.turn&&mov(S.pieces[j][i],S.dice);
    el.classList.toggle('mv',!!can);el.dataset.act=can?'move':'';
  }));
  const hn=$('hint');if(hn){let h='';if(myTurn()&&S.dice){const t=S.turn,ar=S.players[t].arm;S.pieces[t].forEach((a,i)=>{if(mov(a,S.dice)){const[x,y]=pos(G,ar,a===0?1:a+S.dice,i);h+=`<circle class="hint" cx="${x}" cy="${y}" r=".5" stroke="${COL[ar]}"/>`}})}hn.innerHTML=h}
  for(let k=0;k<G.n;k++){const yo=$('yo'+k),on=S.status==='playing'&&S.players[S.turn]?.arm===k;yo?.classList.toggle('on',on);if(yo)yo.style.stroke=on?COL[S.players[S.turn].arm]:'#fff'}
}
function animate(pv){
  const ST=160,fw=(o,p)=>o!==undefined&&p>o&&p-o<=6&&!(o===0&&p!==1);let delay=0;
  S.pieces.forEach((a,j)=>a.forEach((p,i)=>{const o=pv[j]?.[i];if(fw(o,p))delay=Math.max(delay,(p-o)*ST)}));
  S.pieces.forEach((a,j)=>a.forEach((p,i)=>{
    const o=pv[j]?.[i];
    if(o===undefined||o===p){disp[j][i]=p;return}
    if(fw(o,p)){
      let c=o;const el=$('t'+j+'_'+i)?.firstElementChild;
      const step=()=>{c++;disp[j][i]=Math.min(c,S.pieces[j][i]);layout();
        if(!reduced)el?.animate([{transform:'translateY(0) scale(.78)'},{transform:'translateY(-.45px) scale(1.35)',offset:.45},{transform:'translateY(0) scale(1)'}],{duration:ST,easing:'cubic-bezier(.34,1.56,.64,1)'});
        sfx.step();if(c>=p&&p===G.L+5&&S){const q=pos(G,S.players[j].arm,p,i);burst(q[0],q[1],"#ffd166");const yh=$('yh'+S.players[j].arm);yh&&yh.classList.add('yard');setTimeout(()=>yh&&yh.classList.remove('yard'),750)}
        if(c>=p&&p<G.L){const st=$('s'+(13*S.players[j].arm+7+p)%G.L);if(st){st.classList.add('tw');setTimeout(()=>st.classList.remove('tw'),520)}}
        if(c<p&&S)setTimeout(step,ST)};
      step();
    }else if(p===0&&o>0)setTimeout(()=>{if(S){const q=pos(G,S.players[j].arm,o,i);burst(q[0],q[1],COL[S.players[j].arm]);disp[j][i]=S.pieces[j][i];layout()}},delay+80);
    else disp[j][i]=p;
  }));
  layout();
}

async function sub(c){
  ref=db.doc('rooms/'+c);unsub&&unsub();
  unsub=ref.onSnapshot(s=>{if(s.exists){S=s.data();render()}},e=>{leave();setMsg(e.message||'Connection lost')});
  if(!DEMO&&db)try{watchMsgs(c)}catch(e){}
}

async function create(){
  const name=val('nm');if(!name)return setMsg('Enter your name first');
  saveName(name);
  try{
    if(authReady)await authReady;
    let c;for(let t=0;t<6;t++){c=gen();if(!(await db.doc('rooms/'+c).get()).exists)break}
    await db.doc('rooms/'+c).set({v:2,code:c,host:me(),max:maxSel,n:Math.max(4,maxSel),status:'lobby',rnd:0,players:[{id:me(),name}],pieces:[],turn:0,dice:null,last:1,winner:null,fin:[],log:''});
    await sub(c);
  }catch(e){setMsg('Room would not open — give it another go')}
}
async function join(){
  const name=val('nm'),c=val('cd').toUpperCase();
  if(!name)return setMsg('Enter your name first');
  if(c.length<5)return setMsg('Enter the 5-letter room code');
  saveName(name);
  try{
    if(authReady)await authReady;
    const r=await db.doc('rooms/'+c).get();
    if(!r.exists||r.data().v!==2)return setMsg('Room not found');
    const d={...r.data()};
    if(!d.players.some(p=>p.id===me())){
      if(d.status!=='lobby')return setMsg('That game has already started');
      if(d.players.length>=d.max)return setMsg('Room is full');
      let joined=false;
      await db.tx('rooms/'+c,d0=>{if(d0.status!=='lobby'||d0.players.length>=d0.max||d0.players.some(p=>p.id===me()))return null;joined=true;return{...d0,players:[...d0.players,{id:me(),name}]}});
      if(!joined)return setMsg('Room just filled up — try another');
    }
    await sub(c);
  }catch(e){setMsg('Could not join — give it another go')}
}
function save(ns){S=ns;render();ref&&ref.set(ns).catch(e=>setMsg('Lost a beat — syncing…'))}
function start(){
  const cnt=S.players.length,arms=ARMS[cnt];
  save({...S,status:'playing',n:Math.max(4,cnt),rnd:S.rnd+1,players:S.players.map((p,i)=>({...p,arm:arms[i]})),pieces:S.players.map(()=>[0,0,0,0]),turn:0,dice:null,last:1,winner:null,fin:[],log:'Game started!'});
}
const myIdx=()=>S.players.findIndex(p=>p.id===me());
const myTurn=()=>S&&S.status==='playing'&&(DEMO?S.turn===0:myIdx()===S.turn);
function roll(f){
  if(!(f||myTurn())||S.dice)return;
  const n=1+Math.floor(Math.random()*6),t=S.turn;
  save({...S,dice:n,last:n,rc:(S.rc||0)+1,log:`${S.players[t].name} rolled ${n}`});
}
function move(i,f){
  if(!(f||myTurn())||!S.dice)return;
  const t=S.turn,n=S.dice,a=S.pieces[t][i];if(!mov(a,n))return;
  const pcs=S.pieces.map(x=>x.slice()),np=a===0?1:a+n,L=G.L;pcs[t][i]=np;
  let cap=false;
  if(np<L){
    const idx=(13*S.players[t].arm+7+np)%L;
    if(idx%13!==8&&idx%13!==3)S.players.forEach((q,j)=>{if(j!==t)pcs[j]=pcs[j].map(b=>(b>=1&&b<L&&(13*q.arm+7+b)%L===idx)?(cap=true,0):b)});
  }
  const won=pcs[t].every(b=>b===L+5),extra=n===6||cap||np===L+5,nm=S.players[t].name;
  let fin=S.fin||[];
  if(won&&fin.indexOf(t)<0)fin=fin.concat([t]);
  const left=S.players.length-fin.length;
  const done=fin.length>=S.players.length-1;
  let nt;
  if(won||!extra){let n2=(t+1)%S.players.length;while(fin.indexOf(n2)>=0&&n2!==t)n2=(n2+1)%S.players.length;nt=n2}
  else nt=t;
  const w=fin.length?fin[0]:null;
  save({...S,pieces:pcs,dice:null,turn:nt,fin,status:done?'done':'playing',winner:done?w:null,
    log:done?`${S.players[w].name} wins! 🎉`:won?`${nm} finished — ${left} player${left===1?'':'s'} to go 🏁`:`${nm} moved`+(cap?' and captured a piece!':np===L+5?' a piece home!':'')+(extra?' — goes again':'')});
}
function again(){save({...S,status:'lobby',pieces:[],turn:0,dice:null,winner:null,fin:[],log:''})}

function botTick(){
  clearTimeout(botT);
  if(!DEMO||!S||S.status!=='playing'||S.turn===0)return;
  botT=setTimeout(()=>{
    if(!DEMO||!S||S.turn===0)return;
    if(!S.dice)return roll(true);
    const t=S.turn,n=S.dice,L=G.L,ps=S.pieces[t].map((p,i)=>i).filter(i=>mov(S.pieces[t][i],n));
    if(!ps.length)return;

    ps.sort((x,y)=>sc(y)-sc(x));move(ps[0],true);
  },S.dice?950:850);

  <div class="log${mine&&S.status==='playing'?' me':''}" aria-live="polite" style="--c:${COL[cur.arm]}">${S.status==='done'?'':mine?(S.dice?'Tap a glowing piece':'Your turn — tap the dice'):esc(cur.name)+"'s turn"}</div>
  <div class="mut" style="text-align:center;margin-top:6px" aria-live="polite">${esc(S.log)}</div>
  ${S.status==='done'&&host?'<button class="btn" data-act="again">Play again</button>':''}

  if(bot!==lastBot){$('bot').innerHTML=bot;lastBot=bot}
  if(sixUntil>Date.now())$('dice')?.classList.add('six');
  if(prevP)animate(prevP);else{const tk=$('tk');tk.classList.add('nt');layout();void tk.getBoundingClientRect();tk.classList.remove('nt')}
  prevP=S.pieces.map(a=>a.slice());
  const tc=prevTurn===-1||S.turn!==prevTurn;
  if(prevTurn!==-1&&tc&&!reduced){const bd=$('bdw');bd&&bd.classList.add('bdim');setTimeout(()=>bd&&bd.classList.remove('bdim'),380)}
  prevTurn=S.turn;
  if(S.rc!==lastRc){const fresh=lastRc===undefined;if(!skipRc&&!fresh&&$('dice')){const d=$('dice');d.classList.add('rl');sfx.roll();
      if(!reduced){const sh=()=>{const e=$('dice');if(e&&!rolling)e.innerHTML=pips(1+Math.floor(Math.random()*6))};sh();const iv=setInterval(sh,150);setTimeout(()=>{clearInterval(iv);const e=$('dice');if(e&&S){e.innerHTML=pips(S.dice||S.last||1);e.classList.add('land');setTimeout(()=>e.classList.remove('land'),220)}},300)}}
    lastRc=S.rc;skipRc=false;
    if(S.last===6){buzz([15,40,15]);toast('✨ Lucky 6!',1);if(!reduced){const d=$('dice');d&&d.classList.add('six');sixUntil=Date.now()+1100;setTimeout(()=>{const x=$('dice');x&&x.classList.remove('six')},1100)}}}
  if(S.log!==lastLog){const l=S.log||'';if(lastLog&&l){if(/captured/.test(l)){toast('💥 Captured!',1);sfx.cap();buzz(70);if(!reduced){document.body.classList.add('hit');const fl=document.createElement('div');fl.className='flash';document.body.appendChild(fl);setTimeout(()=>{document.body.classList.remove('hit');fl.remove()},480)}}else if(/home!/.test(l)){toast('🏠 Home!',1);sfx.home()}else if(/goes again/.test(l)){toast('↻ Go again!');buzz(20);const d=$('dice');d&&d.classList.add('bonus');setTimeout(()=>{const x=$('dice');x&&x.classList.remove('bonus')},460)}else if(/ finished — /.test(l)){toast('🏁 '+l.slice(0,l.indexOf(' finished'))+' finished!',1);sfx.home()}else if(/wins/.test(l)){toast('🏆 Winner!',1);sfx.win();confetti()}}lastLog=l}
  const tm=!!(mine&&!S.dice&&S.status==='playing'&&tc);if(tm&&!lastTm){sfx.turn();buzz(30);

  lastTm=tm;
  if(S.status==='playing'&&S.dice!=null&&!S.pieces[S.turn].some(a=>mov(a,S.dice))){
    const t2=S.turn,n2=S.dice,rc2=S.rc||0;
    if(nmKey!==rc2){clearTimeout(nmT);nmKey=rc2;const dd=$('dice');dd&&dd.classList.add('dead');nmT=setTimeout(()=>{
      if(S&&S.turn===t2&&S.dice===n2&&(S.rc||0)===rc2){buzz(15);toast('🚫 No move');const fn=S.fin||[];let n3=(t2+1)%S.players.length;while(fn.indexOf(n3)>=0&&n3!==t2)n3=(n3+1)%S.players.length;save({...S,dice:null,turn:n3})}
    },750)}
  }else{clearTimeout(nmT);nmT=null;nmKey=''}
  clearTimeout(autoT);
  if(mine&&S.dice){const t=S.turn,rc=S.rc,mv=S.pieces[t].map((a,i)=>i).filter(i=>mov(S.pieces[t][i],S.dice));if(mv.length&&new Set(mv.map(i=>S.pieces[t][i])).size===1)autoT=setTimeout(()=>{if(S&&S.rc===rc&&S.dice&&myTurn())move(mv[0])},500)}
  if(DEMO)botTick();
}
// ---------- chat ----------
const hhmm=ts=>{const d=new Date(+ts||0);return isFinite(d.getTime())?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):''};
const setBadge=n=>{const b=$('cbadge');if(!b)return;b.hidden=!n;b.textContent=n>99?'99+':n};
function renderMsgs(list){const box=$('msgs');if(!box)return;
  const asc=(list||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<70||!box.childElementCount;
  if(!asc.length){box.innerHTML='<div class="m empty">Say hi 👋</div>';return}
  box.innerHTML=asc.map(m=>{const own=m.i===me(),pl=S&&S.players&&S.players.find(p=>p.id===m.i);
    return '<div class="m'+(own?' me':'')+'" data-id="'+esc(m.id)+'"><b style="--c:'+(pl&&pl.arm!=null?COL[pl.arm]:'#b9b3e6')+'">'+esc(own?'You':(m.n||'Player'))+'</b><span>'+esc(m.t||'')+'</span><time>'+hhmm(m.ts)+'</time></div>'}).join('');
  if(near)requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight})}
function chatChanged(){if(chatOpen){msgs.forEach(m=>seenMsgs.add(m.id));renderMsgs(msgs)}setBadge(msgsUnread)}
function watchMsgs(code){unsubMsgs&&unsubMsgs();msgs=[];msgsUnread=0;seenMsgs=new Set();
  let first=true;
  unsubMsgs=db.watchMsgs(code,d=>{if(!d)return;msgs=d;
    if(first){first=false;msgs.forEach(m=>seenMsgs.add(m.id))}
    else if(!chatOpen)for(const m of msgs)if(!seenMsgs.has(m.id)&&m.i!==me()){msgsUnread++;seenMsgs.add(m.id)}
    chatChanged()})}
function chatToggle(){const f=$('chatFab');if(!f||!S||DEMO)return;
  if(!chatOpen){prevFocus=document.activeElement;chatOpen=true;document.body.classList.add('chat-open');f.setAttribute('aria-expanded','true');msgs.forEach(m=>seenMsgs.add(m.id));msgsUnread=0;setBadge(0);renderMsgs(msgs);
    const ci=$('chatIn');if(ci)ci.focus();
    setTimeout(()=>{const b=$('msgs');if(b)b.scrollTop=b.scrollHeight;vv()},80)}
  else closeChat()}
function closeChat(restore){chatOpen=false;document.body.classList.remove('chat-open');const f=$('chatFab');if(f)f.setAttribute('aria-expanded','false');if(restore!==true&&prevFocus&&prevFocus.focus)try{prevFocus.focus()}catch(e){}prevFocus=null}
function chatSend(t){if(!S||DEMO||!db)return;const k=myIdx();const n=(k>=0&&S.players[k]&&S.players[k].name)||savedName()||'Player';
  db.sendMsg({code:S.code,u:uid||'',i:me(),n:n.slice(0,14),t:t.slice(0,200),ts:Date.now()}).catch(()=>toast('Message not sent'))}
function sendChatMsg(){const i=$('chatIn');if(!i)return;const t=(i.value||'').trim().slice(0,200);if(!t)return;
  if(!S||DEMO||!db)return;if(Date.now()-lastChatSend<650)return;lastChatSend=Date.now();
  chatSend(t);i.value='';const sb=$('chatSend');if(sb)sb.disabled=true}
function vv(){const v=window.visualViewport;if(!v)return;document.documentElement.style.setProperty('--kb',Math.max(0,innerHeight-v.height-v.offsetTop)+'px')}
if(window.visualViewport)try{visualViewport.addEventListener('resize',vv)}catch(e){}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;if(a==='chat')chatToggle();else if(a==='chatclose')closeChat();else if(a==='send')sendChatMsg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&chatOpen){closeChat();return}
  if(e.target.id!=='chatIn')return;
  if(e.isComposing||e.keyCode===229)return;
  if(e.key==='Enter'){e.preventDefault();sendChatMsg()}});
document.addEventListener('input',e=>{if(e.target.id!=='chatIn')return;
  if(e.target.value.length>200)e.target.value=e.target.value.slice(0,200);
  const sb=$('chatSend');if(sb)sb.disabled=!e.target.value.trim()});
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(!AC&&!muted)snd(1,.01,'sine',.0001);try{AC&&AC.resume()}catch(x){}
  const a=t.dataset.act;
  if(a==='create')create();else if(a==='demo')demo();else if(a==='mute'){muted=!muted;try{localStorage.setItem('ludo-mute',muted?'1':'0')}catch(x){}t.textContent=muted?'🔇':'🔊'}else if(a==='join')join();else if(a==='start')start();
  else if(a==='roll'){if(rolling)return;rolling=true;skipRc=true;sfx.roll();buzz(25);roll();const sh=()=>{const d=$('dice');if(d&&S&&S.dice!=null)d.innerHTML=pips(1+Math.floor(Math.random()*6))};sh();rollIv=setInterval(sh,150);setTimeout(()=>{clearInterval(rollIv);rollIv=null;rolling=false;const d=$('dice');if(d&&S&&S.dice!=null)d.innerHTML=pips(S.dice)},480)}
  else if(a==='move')move(+t.dataset.i);else if(a==='again')again();else if(a==='leave')leave();
  else if(a===''){if(myTurn()&&S&&S.dice){buzz(10);const el=t.querySelector('.in');el&&el.animate&&el.animate([{transform:'translateX(0)'},{transform:'translateX(4px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:200,easing:'cubic-bezier(.4,0,.2,1)'})}}
  else if(a==='pc'){maxSel=+t.dataset.n;document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b===t));$('cap').textContent=capt(maxSel)}
  else if(a==='copy'){try{navigator.clipboard.writeText(S.code);t.textContent='🎯 Copied!';t.classList.add('copypulse');setTimeout(()=>t.classList.remove('copypulse'),450)}catch(x){t.textContent=S.code}}
});

<div class="chat-bd" data-act="chatclose"></div>
<button class="chat-fab" id="chatFab" data-act="chat" aria-expanded="false" aria-controls="chatPanel" aria-label="Room chat" hidden>💬<span class="cbadge" id="cbadge" hidden></span></button>

 <header class="chead"><b>Room chat</b><button class="ccl" data-act="chatclose" aria-label="Close chat">✕</button></header>

</section>`);
(async()=>{
  try{
    const [{firebaseConfig},{initializeApp},{getAuth,signInAnonymously,onAuthStateChanged},{getFirestore,doc:fdoc,getDoc,setDoc,onSnapshot,runTransaction,collection,query,orderBy,limit,addDoc}]=await Promise.all([
      import('./firebase-config.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);
    if(firebaseConfig.apiKey==='YOUR_API_KEY')throw new Error('cfg');
    const fb=initializeApp(firebaseConfig),fs=getFirestore(fb);
    // Firestore has no nested arrays, so store pieces as {p0:[..],p1:[..]}
    const enc=d=>({...d,pieces:Object.fromEntries((d.pieces||[]).map((a,i)=>['p'+i,a]))});
    const dec=d=>({...d,pieces:Object.keys(d.pieces||{}).sort().map(k=>d.pieces[k])});
    const snap=s=>({exists:s.exists(),data:()=>s.exists()?dec(s.data()):undefined});
    db={doc:path=>({
      get:async()=>snap(await getDoc(fdoc(fs,path))),
      set:d=>setDoc(fdoc(fs,path),enc(d)),
      onSnapshot:(next,err)=>onSnapshot(fdoc(fs,path),s=>next(snap(s)),err)
    }),
    tx:(path,fn)=>runTransaction(fs,async t=>{const r=fdoc(fs,path);const s=await t.get(r);if(!s.exists())throw Error('gone');const nd=fn(dec(s.data()));if(nd)t.set(r,enc(nd))}),
    sendMsg:o=>addDoc(collection(fs,'rooms/'+o.code+'/msgs'),{u:o.u,i:o.i,n:o.n,t:o.t,ts:o.ts}),
    watchMsgs:(code,cb)=>onSnapshot(query(collection(fs,'rooms/'+code+'/msgs'),orderBy('ts','desc'),limit(50)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>cb(null,e))};
    // Auth resolves off the critical path: reuse a persisted session (no
    // network), else sign in. create()/join() await this before first request.
    authReady=new Promise((res,rej)=>{
      const auth=getAuth(fb);
      const un=onAuthStateChanged(auth,u=>{un();
        if(u)res((uid=u.uid));
        else signInAnonymously(auth).then(c=>res((uid=c.user.uid)),rej)});
    });
    authReady.catch(()=>{if(db){db=null;msg='Arcade offline — check your connection';if(!S)render()}});
    if(!S){const cn=$('cn');cn&&cn.remove();
      document.querySelectorAll('[data-act="create"],[data-act="join"]').forEach(b=>b.disabled=false)}
  }catch(e){db=null;msg=e.message==='cfg'?'Firebase is not configured yet. See README.md.':'Arcade offline — check your connection';if(!S)render()}
})();
</script>
